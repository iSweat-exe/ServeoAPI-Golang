      - files
  /v2/files/{server}/upload:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Uploads a binary file using multipart/form-data. The multipart
        filename may include a relative subpath (e.g. "mods/foo.jar")
        to preserve folder structure from drag-and-drop uploads;
        intermediate directories are created automatically.
      parameters:
      - description: Server Name
        in: path
        name: server
        required: true
        type: string
      - description: Relative destination directory path
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      security:
      - ApiKeyAuth: []
      summary: Upload File
