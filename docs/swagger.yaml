basePath: /
definitions:
  apikeys.ApiKeyResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      prefix:
        type: string
    type: object
  apikeys.CreateApiKeyRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  apikeys.CreateApiKeyResponse:
    properties:
      id:
        type: integer
      name:
        type: string
      token:
        description: Only shown once during creation
        type: string
    type: object
  auth.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  auth.LoginResponse:
    properties:
      token:
        type: string
    type: object
  auth.TicketResponse:
    properties:
      ticket:
        type: string
    type: object
  backups.BackupInfo:
    properties:
      created_at:
        type: string
      filename:
        type: string
      size:
        type: integer
    type: object
  backups.RestoreRequest:
    properties:
      filename:
        type: string
    type: object
  docker.ContainerInfo:
    properties:
      id:
        type: string
      image:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      names:
        items:
          type: string
        type: array
      ports:
        additionalProperties:
          type: string
        type: object
      state:
        type: string
      status:
        type: string
    type: object
  docker.CreateContainerRequest:
    properties:
      env:
        items:
          type: string
        type: array
      image:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      ports:
        additionalProperties:
          type: string
        description: 'ex: {"8080": "80"}'
        type: object
      restart_policy:
        type: string
      volumes:
        description: 'ex: ["myvol:/data", "/var/serveoapi/data/app:/app"]'
        items:
          type: string
        type: array
    type: object
  docker.CreateNetworkRequest:
    properties:
      driver:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
    type: object
  docker.CreateVolumeRequest:
    properties:
      driver:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
    type: object
  docker.DeployStackRequest:
    properties:
      content:
        description: Raw YAML content
        type: string
      name:
        type: string
    type: object
  docker.ImageInfo:
    properties:
      created:
        type: integer
      id:
        type: string
      repo_tags:
        items:
          type: string
        type: array
      size:
        type: integer
    type: object
  docker.NetworkInfo:
    properties:
      driver:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  docker.PullImageRequest:
    properties:
      image:
        description: 'ex: "nginx:latest"'
        type: string
    type: object
  docker.RenameContainerRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  docker.SystemInfo:
    properties:
      containers:
        type: integer
      containers_running:
        type: integer
      containers_stopped:
        type: integer
      images:
        type: integer
      mem_total:
        type: integer
      ncpu:
        type: integer
      server_version:
        type: string
    type: object
  docker.UpdateContainerRequest:
    properties:
      env:
        items:
          type: string
        type: array
      memory:
        description: En Bytes
        type: integer
      ports:
        additionalProperties:
          type: string
        type: object
    type: object
  docker.VolumeInfo:
    properties:
      driver:
        type: string
      mountpoint:
        type: string
      name:
        type: string
    type: object
  files.FileInfo:
    properties:
      is_dir:
        type: boolean
      mod_time:
        type: string
      name:
        type: string
      path:
        description: relative path to the root
        type: string
      size:
        type: integer
    type: object
  firewall.AddRuleRequest:
    properties:
      action:
        description: 'Action: "allow", "deny", "reject" ou "limit".'
        type: string
      comment:
        type: string
      from:
        description: 'From: IP ou CIDR autorisé/visé, "any" par défaut.'
        type: string
      port:
        description: 'Port: un port ("8080") ou une plage ("8000:9000").'
        type: string
      protocol:
        description: 'Protocol: "tcp", "udp", ou vide pour les deux.'
        type: string
    type: object
  firewall.Rule:
    properties:
      action:
        type: string
      from:
        type: string
      number:
        type: integer
      to:
        type: string
    type: object
  firewall.StatusResponse:
    properties:
      active:
        type: boolean
      rules:
        items:
          $ref: '#/definitions/firewall.Rule'
        type: array
    type: object
  metadata.MetadataResponse:
    properties:
      api_version:
        type: string
      author:
        type: string
      commit_hash:
        type: string
      deprecated:
        type: boolean
      deprecation_info:
        type: string
      github_link:
        type: string
      go_version:
        type: string
      protocol_version:
        type: integer
    type: object
  metrics.ContainerStat:
    properties:
      block_read:
        type: number
      block_write:
        type: number
      container_id:
        description: L'index composite sert les requêtes d'historique filtrées par
          conteneur et fenêtre de temps.
        type: string
      cpu_percent:
        type: number
      id:
        type: integer
      memory_limit:
        type: integer
      memory_percent:
        type: number
      memory_usage:
        type: integer
      network_rx:
        type: number
      network_tx:
        type: number
      timestamp:
        type: string
    type: object
  metrics.SystemStat:
    properties:
      cpu_percent:
        type: number
      disk_total:
        type: integer
      disk_usage:
        type: integer
      id:
        type: integer
      memory_total:
        type: integer
      memory_usage:
        type: integer
      network_rx:
        type: number
      network_tx:
        type: number
      timestamp:
        type: string
    type: object
  ovh.OvhMeResponse:
    properties:
      email:
        type: string
      firstname:
        type: string
      name:
        type: string
    type: object
  permissions.Group:
    properties:
      label:
        type: string
      resource:
        type: string
      scopes:
        items:
          $ref: '#/definitions/permissions.Scope'
        type: array
    type: object
  permissions.Scope:
    properties:
      key:
        type: string
      label:
        type: string
    type: object
  system.SystemResponse:
    properties:
      arch:
        type: string
      cpu_usage:
        type: number
      disk_total:
        type: integer
      disk_used:
        type: integer
      hostname:
        type: string
      kernel_version:
        type: string
      network_rx:
        type: integer
      network_tx:
        type: integer
      os:
        type: string
      ping:
        type: string
      platform:
        type: string
      ram_total:
        type: integer
      ram_used:
        type: integer
      uptime:
        type: integer
    type: object
  templates.DeployTemplateRequest:
    properties:
      variables:
        additionalProperties:
          type: string
        description: 'Valeurs des variables (ex: {"EULA": "TRUE"})'
        type: object
    type: object
  templates.TemplateInfo:
    properties:
      category:
        description: 'ex: "game", "database", "app", "lang"'
        type: string
      description:
        type: string
      docker:
        allOf:
        - $ref: '#/definitions/docker.CreateContainerRequest'
        description: Le payload exact à envoyer à /v2/docker/containers/create
      id:
        type: string
      logo:
        type: string
      name:
        type: string
      variables:
        description: Variables à demander à l'utilisateur
        items:
          $ref: '#/definitions/templates.TemplateVariable'
        type: array
    type: object
  templates.TemplateVariable:
    properties:
      default:
        description: Valeur par défaut
        type: string
      description:
        description: Description pour l'UI
        type: string
      label:
        description: 'Le label pour l''UI (ex: "Server Name")'
        type: string
      name:
        description: 'Le nom du placeholder utilisé dans la config Docker (ex: "SERVER_NAME")'
        type: string
      required:
        description: Est-ce obligatoire ?
        type: boolean
    type: object
  users.AdminUpdatePasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
    required:
    - new_password
    type: object
  users.CreateUserRequest:
    properties:
      password:
        minLength: 8
        type: string
      permissions:
        type: string
      profile_picture:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  users.UpdatePasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  users.UpdateUserRequest:
    properties:
      permissions:
        type: string
      profile_picture:
        type: string
      status:
        description: permet de bannir ou forcer la déconnexion
        type: string
    type: object
  users.UserResponse:
    properties:
      id:
        type: integer
      last_connection:
        type: integer
      permissions:
        type: string
      profile_picture:
        type: string
      status:
        type: string
      username:
        type: string
      uuid:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is the modular ServeoAPI management server.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: ServeoAPI
  version: "2.0"
paths:
  /health:
    get:
      description: Verifies the health of the API (Database and Docker Socket)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health Check
      tags:
      - system
  /prometheus:
    get:
      description: Exposes Prometheus metrics for the API (requires JWT auth)
      produces:
      - text/plain
      responses:
        "200":
          description: Prometheus metrics
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Prometheus Metrics
      tags:
      - system
  /v2/apikeys/:
    get:
      description: Get all API Keys for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/apikeys.ApiKeyResponse'
            type: array
      security:
      - ApiKeyAuth: []
      summary: List API Keys
      tags:
      - apikeys
  /v2/apikeys/{id}:
    delete:
      description: Delete an API Key
      parameters:
      - description: API Key ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Revoke API Key
      tags:
      - apikeys
  /v2/apikeys/create:
    post:
      consumes:
      - application/json
      description: Generate a new Personal Access Token (PAT) for AIs
      parameters:
      - description: Key details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apikeys.CreateApiKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/apikeys.CreateApiKeyResponse'
      security:
      - ApiKeyAuth: []
      summary: Create API Key
      tags:
      - apikeys
  /v2/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns a JWT token
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "401":
          description: Invalid credentials
          schema:
            type: string
      summary: Login to the API
      tags:
      - auth
  /v2/auth/logout:
    post:
      description: Sets the user status to offline
      responses:
        "204":
          description: No Content
      security:
      - ApiKeyAuth: []
      summary: Logout from the API
      tags:
      - auth
  /v2/auth/ticket:
    post:
      description: Génère un ticket court à usage unique (valable 30 secondes) pour
        authentifier une connexion WebSocket sans exposer le JWT dans l'URL.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TicketResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Generate a WebSocket Ticket
      tags:
      - auth
  /v2/backups/{server}:
    get:
      description: Lists available backups for a server
      parameters:
      - description: Server name (folder name)
        in: path
        name: server
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/backups.BackupInfo'
            type: array
      security:
      - ApiKeyAuth: []
      summary: List Server Backups
      tags:
      - backups
    post:
      description: Creates a zip archive of the server's data folder
      parameters:
      - description: Server name (folder name)
        in: path
        name: server
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/backups.BackupInfo'
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Create Server Backup
      tags:
      - backups
  /v2/backups/{server}/restore:
    post:
      consumes:
      - application/json
      description: Restores a server backup, overwriting existing files
      parameters:
      - description: Server name (folder name)
        in: path
        name: server
        required: true
        type: string
      - description: Restore options
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/backups.RestoreRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Restore Server Backup
      tags:
      - backups
  /v2/docker/compose/deploy:
    post:
      consumes:
      - application/json
      description: Deploys a stack from a docker-compose.yml file. Strict security
        checks applied to volumes.
      parameters:
      - description: Stack details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/docker.DeployStackRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Stack deployed successfully
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Deploy a Docker Compose Stack
      tags:
      - docker-compose
  /v2/docker/containers/:
    get:
      consumes:
      - application/json
      description: Returns a list of all docker containers
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/docker.ContainerInfo'
            type: array
      security:
      - ApiKeyAuth: []
      summary: List Docker Containers
      tags:
      - docker-containers
  /v2/docker/containers/{id}:
    delete:
      description: Removes a container. Pass ?force=true to force removal of a running
        container.
      parameters:
      - description: Container ID
        in: path
        name: id
        required: true
        type: string
      - description: Force remove
        in: query
        name: force
        type: boolean
      responses:
        "204":
          description: No Content
      security:
      - ApiKeyAuth: []
      summary: Delete a Docker Container
      tags:
      - docker-containers
    get:
      description: Returns detailed information about a container
      parameters:
      - description: Container ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Inspect a Docker Container
      tags:
      - docker-containers
  /v2/docker/containers/{id}/{action}:
    post:
      description: 'Action must be one of: start, stop, restart'
      parameters:
      - description: Container ID
        in: path
        name: id
        required: true
        type: string
      - description: Action to perform (start, stop, restart)
        in: path
        name: action
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - ApiKeyAuth: []
      summary: Perform action on a container (start, stop, restart)
      tags:
      - docker-containers
  /v2/docker/containers/{id}/exec:
    get:
      description: Upgrades connection to a WebSocket. Un ticket court (généré via
        /v2/auth/ticket) doit être fourni en paramètre d'URL (?ticket=...). Outputs
        raw binary frames.
      parameters:
      - description: Container ID
        in: path
        name: id
        required: true
        type: string
      - description: Authentication Ticket
        in: query
        name: ticket
        required: true
        type: string
      responses:
        "101":
          description: Switching Protocols to WebSocket
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Interactive Docker Terminal (WebSocket)
      tags:
      - docker
  /v2/docker/containers/{id}/logs:
    get:
      description: Streams logs of a container using Server-Sent Events
      parameters:
      - description: Container ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: Event Stream
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Stream Container Logs (SSE)
      tags:
      - docker-containers
  /v2/docker/containers/{id}/rename:
    patch:
      consumes:
      - application/json
      description: Renames an existing Docker container.
      parameters:
      - description: Container ID
        in: path
        name: id
        required: true
        type: string
      - description: New name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/docker.RenameContainerRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Rename a Docker Container
      tags:
      - docker-containers
  /v2/docker/containers/{id}/stats:
    get:
      description: Streams CPU/RAM stats of a container using Server-Sent Events
      parameters:
      - description: Container ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: Event Stream
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Stream Container Stats (SSE)
      tags:
      - docker-containers
  /v2/docker/containers/{id}/update:
    put:
      consumes:
      - application/json
      description: Updates a container's environment variables or RAM limit transparently
        (recreates it)
      parameters:
      - description: Container ID
        in: path
        name: id
        required: true
        type: string
      - description: Update configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/docker.UpdateContainerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/docker.ContainerInfo'
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Update a Docker Container
      tags:
      - docker-containers
  /v2/docker/containers/create:
    post:
      consumes:
      - application/json
      description: Deploys a new container. Bind mounts are strictly restricted for
        security.
      parameters:
      - description: Container configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/docker.CreateContainerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/docker.ContainerInfo'
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Create and Start a Docker Container
      tags:
      - docker-containers
  /v2/docker/images/:
    get:
      consumes:
      - application/json
      description: Returns a list of all docker images
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/docker.ImageInfo'
            type: array
      security:
      - ApiKeyAuth: []
      summary: List Docker Images
      tags:
      - docker-images
  /v2/docker/images/{id}:
    delete:
      description: Removes an image
      parameters:
      - description: Image ID or Tag
        in: path
        name: id
        required: true
        type: string
      - description: Force remove
        in: query
        name: force
        type: boolean
      responses:
        "204":
          description: No Content
      security:
      - ApiKeyAuth: []
      summary: Delete a Docker Image
      tags:
      - docker-images
  /v2/docker/images/pull:
    post:
      consumes:
      - application/json
      description: Pulls an image and streams progress using Server-Sent Events
      parameters:
      - description: Image to pull
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/docker.PullImageRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: Event Stream
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Pull Docker Image (SSE)
      tags:
      - docker-images
  /v2/docker/networks/:
    get:
      description: Returns a list of all networks
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
