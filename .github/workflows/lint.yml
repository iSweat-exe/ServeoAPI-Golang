name: Lint & Format Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install tools
        run: |
          go install mvdan.cc/gofumpt@latest
          go install golang.org/x/tools/cmd/goimports@latest
          go install github.com/segmentio/golines@latest

      - name: Check formatting
        run: |
          test -z "$(gofumpt -l .)" || (echo "❌ Code non formaté (gofumpt). Lance 'gofumpt -w .'" && exit 1)
          test -z "$(golines -m 99 -l --base-formatter gofumpt .)" || (echo "❌ Lignes trop longues (golines)" && exit 1)

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest