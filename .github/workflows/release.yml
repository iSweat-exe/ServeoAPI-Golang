name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5' # Vous pouvez ajuster cette version si nécessaire

      - name: Get Version info
        id: vars
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "COMMIT_HASH=$(echo $GITHUB_SHA | cut -c 1-7)" >> $GITHUB_OUTPUT

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          UPDATE_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
        run: |
          LDFLAGS="-s -w -X serveoapi/internal/core/config.AppVersion=${{ steps.vars.outputs.VERSION }} -X serveoapi/internal/core/config.CommitHash=${{ steps.vars.outputs.COMMIT_HASH }} -X serveoapi/internal/core/config.UpdatePublicKey=${UPDATE_PUBLIC_KEY}"
          BINARY_NAME="serveoapi_${{ matrix.goos }}_${{ matrix.goarch }}"

          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi

          go build -ldflags "$LDFLAGS" -o $BINARY_NAME ./cmd/api
          echo "BINARY_NAME=$BINARY_NAME" >> $GITHUB_ENV

      # La commande "update" refuse tout binaire non signé : chaque asset est publié
      # avec sa signature minisign.
      - name: Sign Binary
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
        run: |
          if [ -z "$MINISIGN_PRIVATE_KEY" ]; then
            echo "::error::Le secret MINISIGN_PRIVATE_KEY est requis pour signer les binaires de release."
            echo "::error::Ajoutez-le dans Settings → Secrets and variables → Actions (contenu du fichier minisign.key)."
            exit 1
          fi

          # #region agent log
          PRIV_LEN=${#MINISIGN_PRIVATE_KEY}
          PUB_LEN=${#MINISIGN_PUBLIC_KEY}
          HAS_COMMENT=false
          printf '%s' "$MINISIGN_PRIVATE_KEY" | tr -d '\r' | head -n1 | grep -q '^untrusted comment:' && HAS_COMMENT=true
          echo "::notice::debug-9793e9 minisign go-sign: private_len=$PRIV_LEN public_len=$PUB_LEN has_comment=$HAS_COMMENT binary=$BINARY_NAME"
          # #endregion

          # Signature via Go (aead.dev/minisign) : accepte fichier complet OU corps base64 seul
          # (le CLI C minisign échoue si la ligne untrusted comment est absente du secret).
          go run ./scripts/sign-release -m "$BINARY_NAME" -x "${BINARY_NAME}.minisig"

          # #region agent log
          if [ -f "${BINARY_NAME}.minisig" ]; then
            SIG_BYTES=$(wc -c < "${BINARY_NAME}.minisig" | tr -d ' ')
            echo "::notice::debug-9793e9 minisign go-sign: ok sig_bytes=$SIG_BYTES"
          else
            echo "::error::debug-9793e9 minisign go-sign: missing signature file"
            exit 1
          fi
          # #endregion

      - name: Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            serveoapi_*
